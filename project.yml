name: EyeTracking
options:
  bundleIdPrefix: com.deanbean
  developmentLanguage: de
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Version.xcconfig
  Release: Config/Version.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ARCHS: arm64
    DEAD_CODE_STRIPPING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
packages:
  EyeCore:
    path: Packages/EyeCore
targets:
  EyeTracking:
    type: application
    platform: macOS
    sources:
      - path: App
      # Fetched by scripts/fetch_mediapipe.sh (gitignored).
      - path: Vendor/mediapipe/face_landmarker.task
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: EyeTracking
        PRODUCT_BUNDLE_IDENTIFIER: com.deanbean.eyetracking
        INFOPLIST_FILE: Config/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Config/EyeTracking.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    dependencies:
      - package: EyeCore
        product: CoreKit
      - package: EyeCore
        product: UpdateKit
      - package: EyeCore
        product: AppSupportKit
      - package: EyeCore
        product: TrackingKit
      - package: EyeCore
        product: GazeKit
      # Loaded at runtime with dlopen by the CMediaPipe shim, so it is embedded but not linked.
      - framework: Vendor/mediapipe/libmediapipe.dylib
        embed: true
        link: false
        codeSign: true
schemes:
  EyeTracking:
    build:
      targets:
        EyeTracking: all
    run:
      config: Debug
    archive:
      config: Release
